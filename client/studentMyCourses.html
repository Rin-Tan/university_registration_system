{% load static %}
<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <title>My Courses</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'css/common.css' %}">
  <link rel="stylesheet" href="{% static 'css/courses.css' %}">

  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <img src="{% static 'images/student-logo.svg' %}" class="brand-logo" alt="logo">
      <div>
        <div class="brand-title">Student Panel</div>
        <div class="brand-sub">My Courses</div>
      </div>
    </div>

       <nav class="nav">
        <button class="nav-item active">
            <img src="{% static 'images/icon-park_book-one.svg' %}" class="brand-logo-small" alt="">
        My Courses
        </button>
          <button class="nav-item" onclick="window.location.href='{% url 'student_courses' %}'"> 
           <img src="{% static 'images/icon-park_book-one.svg' %}" class="brand-logo-small">
          Courses Offered
        </button>
       </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="main-header">
      <h2 class="title-with-logo">
        <img src="{% static 'images/hugeicons_course.svg' %}" class="title-icon" alt="">
        My Courses
      </h2>
    </header>

    <section class="table-wrap">
      <table class="courses-table">
        <thead>
          <tr>
            <th>Course</th>
            <th>Code</th>
            <th>Units</th>
            <th>Time</th>
            <th>Location</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="myCoursesTbody"></tbody>
      </table>

      <div id="emptyState" class="empty-state">
        You have not enrolled in any courses.
      </div>
    </section>

  </main>
</div>

<!-- JS -->
<script src="{% static 'js/studentMyCourses.js' %}"></script>

</body>
</html>
