{% load static %}
<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <title>Professor Courses</title>

  <link rel="stylesheet" href="{% static 'css/common.css' %}">
  <link rel="stylesheet" href="{% static 'css/courses.css' %}">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <img src="{% static 'images/student-logo.svg' %}" class="brand-logo" alt="Logo">
      <div>
        <div class="brand-title">Professor Panel</div>
        <div class="brand-sub">My Courses</div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active">
        <img src="{% static 'images/icon-park_book-one.svg' %}" class="brand-logo-small" alt="">
        My Courses
      </button>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="main-header">
      <h2 class="title-with-logo">
        <img src="{% static 'images/hugeicons_course.svg' %}" class="title-icon" alt="">
        My Courses
      </h2>
    </header>

    <!-- COURSES TABLE -->
    <section class="table-wrap">
      <table class="courses-table">
        <thead>
          <tr>
            <th>Course</th>
            <th>Code</th>
            <th>Units</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="coursesTbody"></tbody>
      </table>
    </section>

    <!-- STUDENTS TABLE -->
    <section class="table-wrap" id="studentsSection" style="display:none;">
      <h3 style="margin:16px 0;">Enrolled Students</h3>
      <table class="courses-table">
        <thead>
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Student ID</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="studentsTbody"></tbody>
      </table>
    </section>

  </main>
</div>

<!-- JS -->
<script src="{% static 'js/professor_courses.js' %}"></script>
</body>
</html>
